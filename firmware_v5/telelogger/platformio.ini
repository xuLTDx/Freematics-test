; ============================================================
; PlatformIO konfigurácia pre Freematics telelogger
; Tvoje nastavenia: WiFi vypnuté, UDP, server ultd.mooo.com:5002
; ============================================================

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Nastavenia pre Freematics ONE+ s PSRAM
board_build.partitions = huge_app.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600

; ==============================================
; Tvoje compiler flags
; ==============================================
build_flags =
    -DGNSS=GNSS_STANDALONE
    -DSTORAGE=STORAGE_SD
    -DLOG_EXT_SENSORS=0
    -DSERVER_PROTOCOL=PROTOCOL_UDP
    -DENABLE_OBD=1
    -DENABLE_MEMS=1
    -DCELL_APN=\"internet\"
    -DENABLE_WIFI=0
    -DWIFI_SSID=\"\"
    -DWIFI_PASSWORD=\"\"
    -DSERVER_HOST=\"ultd.mooo.com\"
    -DSERVER_PORT=5002
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV

; ==============================================
; Cesta k knižniciam (FreematicsPlus)
; ==============================================
lib_extra_dirs =
    ../../libraries

[platformio]
src_dir = .