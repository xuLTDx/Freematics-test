; ============================================================
; PlatformIO konfigurácia pre Freematics telelogger
; Tvoje nastavenia: WiFi zapnuté (fallback na celulár), UDP, server ultd.mooo.com:5002
; ============================================================

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Nastavenia pre Freematics ONE+ s PSRAM
; min_spiffs.csv: 2x OTA app slot (~1.9MB každý) + malý SPIFFS + coredump.
; Predtým huge_app.csv - tá má LEN JEDNU app partíciu (žiadny ota_0/ota_1
; pár), takže Update.begin()/write() (POST na /api/ota aj SD-staged
; performPullOtaFlash()) prepisovalo naživo tú istú partíciu, z ktorej ESP32
; práve vykonával bežiaci kód -> PANIC (RESET_REASON=4) uprostred zápisu,
; potvrdené 2026-09-15 pri pokuse o OTA cez WiFi. Firmware (~1.78MB) sa do
; 1.9MB slotu zmestí s rezervou.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600

; Prompts for WIFI_PASSWORD / WIFI_PASSWORD2 at build time (getpass, hidden
; input) instead of storing them in this file. See wifi_secrets.py.
extra_scripts = pre:wifi_secrets.py

; ==============================================
; Tvoje compiler flags
; ==============================================
build_flags =
    -DGNSS=GNSS_STANDALONE
    -DSTORAGE=STORAGE_SD
    -DLOG_EXT_SENSORS=0
    -DSERVER_PROTOCOL=PROTOCOL_UDP
    -DENABLE_OBD=1
    -DENABLE_MEMS=1
    -DCELL_APN=\"internet\"
    -DENABLE_WIFI=1
    -DSERVER_HOST=\"ultd.mooo.com\"
    -DSERVER_PORT=5002
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV

; ==============================================
; Cesta k knižniciam (FreematicsPlus)
; ==============================================
lib_extra_dirs =
    ../../libraries

; ============================================================
; Zafira/PSA build - rovnaký hardvér, rovnaké univerzálne funkcie
; (WiFi/celulár/GPS/SD/Mode1 OBD), ale VAG-špecifický ODO/FUEL UDS blok
; (natvrdo zakódované VW gateway adresy/DID, nič nehovoriace PSA autu)
; je vypnutý cez ENABLE_VAG_ODO_FUEL=0.
; ============================================================
[env:esp32dev_zafira]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_VAG_ODO_FUEL=0
    -DENABLE_PSA_ODO_FUEL=1
    ; Confirmed twice now (2026-09-15): BLE is incompatible with stable WiFi
    ; on this firmware's current footprint, on its own. Test 1 (BLE on,
    ; CAN-sniff buffer still present): free=5708 maxblock=2676, WiFi
    ; disconnected 6x in 20s. Test 2 (BLE on, CAN-sniff buffer removed,
    ; telemetry task now claims its 16KB stack early): free=13184
    ; maxblock=6388 - better, but WiFi still disconnected 13x in 45s and
    ; OTA-pull TLS still gets skipped for low heap. BLE's own footprint is
    ; too large regardless of these other fixes. Stays a per-build flag
    ; (ENABLE_BLE defaults to 1 in config.h; other envs like esp32dev/Passat
    ; keep BLE unless they too override it). Real fix for bringing BLE back
    ; is a lighter stack (NimBLE-Arduino instead of the default Bluedroid
    ; BLEDevice) - tracked as a separate follow-up, not done here.
    -DENABLE_BLE=0

[platformio]
src_dir = .