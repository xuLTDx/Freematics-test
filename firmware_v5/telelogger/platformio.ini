; ============================================================
; PlatformIO konfigurácia pre Freematics telelogger
; Tvoje nastavenia: WiFi zapnuté (fallback na celulár), UDP, server ultd.mooo.com:5002
; ============================================================

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

; Nastavenia pre Freematics ONE+ s PSRAM
; min_spiffs.csv: 2x OTA app slot (~1.9MB každý) + malý SPIFFS + coredump.
; Predtým huge_app.csv - tá má LEN JEDNU app partíciu (žiadny ota_0/ota_1
; pár), takže Update.begin()/write() (POST na /api/ota aj SD-staged
; performPullOtaFlash()) prepisovalo naživo tú istú partíciu, z ktorej ESP32
; práve vykonával bežiaci kód -> PANIC (RESET_REASON=4) uprostred zápisu,
; potvrdené 2026-09-15 pri pokuse o OTA cez WiFi. Firmware (~1.78MB) sa do
; 1.9MB slotu zmestí s rezervou.
board_build.partitions = min_spiffs.csv
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi

monitor_speed = 115200
upload_speed = 921600

; Prompts for WIFI_PASSWORD / WIFI_PASSWORD2 at build time (getpass, hidden
; input) instead of storing them in this file. See wifi_secrets.py.
; publish_ota.py (post-build): auto-scp's firmware.bin to the OTA server and
; registers it as the new target_build - see publish_ota_config.example.json
; for setup. A no-op (just prints a note) if publish_ota_config.json (secret,
; gitignored - it maps env -> per-device registry.json token) isn't present.
extra_scripts =
    pre:wifi_secrets.py
    post:publish_ota.py

; ==============================================
; Tvoje compiler flags
; ==============================================
build_flags =
    -DGNSS=GNSS_STANDALONE
    -DSTORAGE=STORAGE_SD
    -DLOG_EXT_SENSORS=0
    -DSERVER_PROTOCOL=PROTOCOL_UDP
    -DENABLE_OBD=1
    -DENABLE_MEMS=1
    -DCELL_APN=\"internet\"
    -DENABLE_WIFI=1
    -DSERVER_HOST=\"ultd.mooo.com\"
    -DSERVER_PORT=5002
    -DBOARD_HAS_PSRAM=1
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV

; ==============================================
; Cesta k knižniciam (FreematicsPlus)
; ==============================================
lib_extra_dirs =
    ../../libraries

; ============================================================
; Single unified build (2026-09-16): removed the separate esp32dev_zafira
; environment - the VAG/PSA UDS split it existed for is dead code (both
; vehicles get the exact same firmware.bin/OTA target now). If a real
; per-vehicle firmware difference is ever needed again, add a new env back
; here rather than reintroducing the VAG/PSA split.
; ============================================================

[platformio]
src_dir = .