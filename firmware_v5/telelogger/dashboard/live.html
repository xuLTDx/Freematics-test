<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="10">
<title>Freematics Live</title>
<style>
body { font-family: monospace; background:#111; color:#0f0; padding:1em; }
pre { white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<pre id="d">loading...</pre>
<script>
fetch('/api/live').then(function(r){ return r.text(); }).then(function(t){
  try {
    document.getElementById('d').textContent = JSON.stringify(JSON.parse(t), null, 2);
  } catch (e) {
    document.getElementById('d').textContent = t;
  }
}).catch(function(e){
  document.getElementById('d').textContent = 'fetch failed: ' + e;
});
</script>
</body>
</html>
